<title>لعبة العام - تصويت الأصدقاء</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#232340,#12121a 60%) fixed;color:#eee;min-height:100vh}
header{background:#1d1d2bcc;backdrop-filter:blur(6px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5;border-bottom:1px solid #2c2c40}
h1{font-size:17px;margin:0}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#1d1d2b;border:1px solid #2a2a3d;border-radius:14px;padding:14px;margin:10px 0;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
input,textarea,button{font:inherit;width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #444;background:#12121a;color:#eee}
input:focus,textarea:focus{outline:2px solid #e8b923;border-color:transparent}
button{background:linear-gradient(135deg,#f3c63a,#e89b23);color:#111;border:0;font-weight:bold;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s;position:relative;overflow:hidden}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px #e8b92344;filter:brightness(1.07)}
button:active{transform:scale(.95)}
button:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
button.sec{background:#2d2d42;color:#eee;width:auto;padding:8px 14px;margin:0;font-weight:normal}
button.sec:hover{box-shadow:0 6px 16px #0006}
button.voted{background:linear-gradient(135deg,#3ddc84,#1fa860);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.ripple{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.msg{color:#ff8a8a;min-height:20px}
.ok{color:#8aff9a}
.nm{display:block;direction:ltr;unicode-bidi:isolate}
html[dir=rtl] .nm{text-align:right}
html[dir=ltr] .nm{text-align:left}
.win{background:linear-gradient(135deg,#3a2c05,#7a5a0a);border:2px solid #f3c63a;text-align:center;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px #f3c63a55}to{box-shadow:0 0 28px #f3c63acc}}
.win .cover{width:120px;height:160px;margin:8px auto;display:block}
.win .ph{width:120px;height:160px;margin:8px auto}
.win h2{margin:4px 0;color:#f3d66a}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#3a3a55;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;vertical-align:middle;margin-inline-end:6px;flex:none;color:#fff;overflow:hidden}
.av.big{width:84px;height:84px;font-size:32px;margin:6px auto;display:flex}
.menubtn{width:auto!important;padding:4px 12px!important;margin:0!important;font-size:20px;line-height:1.2}
.menu{position:absolute;top:50px;inset-inline-end:10px;background:#252538;border:1px solid #3a3a55;border-radius:12px;min-width:210px;padding:6px;z-index:30;animation:rise .2s ease;box-shadow:0 10px 30px #000a}
.menu button{background:transparent;color:#eee;text-align:start;font-weight:normal;margin:0;padding:11px;border-radius:8px}
.menu button:hover{background:#34344d;transform:none;box-shadow:none;filter:none}
.hd{display:flex;align-items:center;gap:6px}
.lang{width:auto!important;padding:6px 10px!important;margin:0!important}
.small{color:#aaa;font-size:13px}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{margin:0;background:#232336;color:#ccc;font-weight:normal;padding:9px 4px;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,#f3c63a,#e89b23);color:#111;font-weight:bold}
.gm{display:flex;gap:12px;align-items:stretch}
.cover{width:84px;min-width:84px;height:112px;border-radius:10px;object-fit:cover;background:#2a2a3d;transition:transform .3s}
.card:hover .cover{transform:scale(1.04) rotate(-1deg)}
.ph{width:84px;min-width:84px;height:112px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px;color:#fff;text-align:center;padding:4px}
.info{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row button{margin:0}
.track{height:8px;background:#2a2a3d;border-radius:4px;overflow:hidden;margin-top:6px}
.bar{height:100%;background:linear-gradient(90deg,#e8b923,#f3d66a);border-radius:4px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rev{border-top:1px solid #333;padding:8px 0;animation:rise .4s ease both}
.cd{display:flex;gap:8px;justify-content:center;text-align:center}
.cd div{background:#12121a;border-radius:10px;padding:8px 10px;min-width:62px}
.cd b{font-size:22px;color:#e8b923;display:block}
.rank{display:flex;align-items:center;gap:10px;margin:12px 0}
.rank .n{font-size:24px;width:34px;text-align:center}
.rank .cover{width:44px;min-width:44px;height:58px}
.rank .ph{width:44px;min-width:44px;height:58px;font-size:14px}
a{color:#e8b923;cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3ddc84;color:#111;padding:10px 18px;border-radius:20px;font-weight:bold;z-index:9;animation:rise .3s ease}
.foot{text-align:center;margin:18px 0 30px}
.foot button{background:transparent;border:1px solid #444;color:#ccc;font-weight:normal;width:auto;padding:8px 16px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#1d1d2b;border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:640px;max-height:90vh;overflow:auto;animation:rise .3s ease}
.sheet a.btn{display:block;text-align:center;background:linear-gradient(135deg,#f3c63a,#e89b23);color:#111;font-weight:bold;padding:11px;border-radius:10px;text-decoration:none;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{width:auto;margin:0;padding:6px 12px;font-size:13px;background:#232336;color:#ccc;font-weight:normal}
.chips button.on{background:#e8b923;color:#111}
.off{background:#8a2b2b;color:#fff;text-align:center;padding:6px;font-size:13px;position:sticky;top:48px;z-index:4}
.badge{background:#3ddc84;color:#111;border-radius:8px;padding:1px 7px;font-size:11px;margin-inline-start:4px}
.spin{text-align:center;padding:30px;color:#aaa}
</style>

async function load(){
  const [vs,rs,us]=await Promise.all([getDocs(collection(db,"votes")),getDocs(collection(db,"reviews")),getDocs(collection(db,"users"))]);
  users={};us.forEach(d=>users[d.id]=d.data());
  if(me&&users[me.uid])profile=users[me.uid];
  const votes=[],reviews=[];
  vs.forEach(d=>votes.push({uid:d.id,...d.data()}));
  rs.forEach(d=>reviews.push(d.data()));
  reviews.sort((a,b)=>(b.ts?.seconds||9e9)-(a.ts?.seconds||9e9));

}

  const lines=GAMES.slice().sort((a,b)=>(c[b.id]||0)-(c[a.id]||0)).map((g,i)=>t("res_line",i+1,g.name,c[g.id]||0));
  const text=t("res_msg",n)+"\n"+lines.join("\n")+"\n"+t("res_join")+location.origin+location.pathname;
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e.name==="AbortError")return}}
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}

function resultsView(){
  const c=counts(),total=data.votes.length;
  const sorted=GAMES.slice().sort((a,b)=>(c[b.id]||0)-(c[a.id]||0));
  const top=c[sorted[0].id]||0,tied=sorted.filter(g=>(c[g.id]||0)===top);
  const medals=["🥇","🥈","🥉"];
  const names=g=>data.votes.filter(v=>v.game===g.id).map(v=>esc(dname(v.uid,v.username))).join(lang==="ar"?"، ":", ");
  shell(`<div class="card"><b>${t("res_total",total)}</b>
   ${total?`<div class="small" style="margin-top:4px">${tied.length>1?t("res_tie",tied.map(g=>bdi(g.name)).join(t("and"))):t("res_lead",bdi(sorted[0].name))}</div>`:`<div class="small">${t("res_none")}</div>`}</div>`+
  sorted.map((g,i)=>`<div class="card" style="animation-delay:${i*.06}s"><div class="rank"><div class="n">${medals[i]||i+1}</div>${art(g)}
   <div class="info" style="gap:4px"><b class="nm">${esc(g.name)}</b><div class="small">${t("votes",c[g.id]||0)} (${total?Math.round((c[g.id]||0)/total*100):0}%)</div>
   <div class="track"><div class="bar" data-w="${total?Math.round((c[g.id]||0)/total*100):0}"></div></div></div></div>
   ${names(g)?`<div class="small">👥 ${names(g)}</div>`:""}</div>`).join(""));
  setTimeout(()=>document.querySelectorAll(".bar").forEach(b=>b.style.width=b.dataset.w+"%"),50);
}

function reviewsView(){
  const list=data.reviews.filter(r=>!rfilter||r.game===rfilter);
  shell(`<div class="chips"><button data-f="" class="${rfilter===""?"on":""}">${t("rev_all")}</button>${GAMES.map(g=>`<button data-f="${g.id}" class="${rfilter===g.id?"on":""}">${esc(g.short)}</button>`).join("")}</div>
  <div class="card"><b>${t("rev_h",list.length)}</b>
  ${list.map(r=>{const g=GAMES.find(x=>x.id===r.game);return g?`<div class="rev">${avatar(r.uid,r.username)}<b>${esc(dname(r.uid,r.username))}</b>${r.uid===me.uid?`<span class="badge">${t("rev_you")}</span>`:""} <span class="small">${t("rev_about")} ${bdi(g.name)}</span><div>${esc(r.text)}</div></div>`:""}).join("")||`<div class="small">${t("rev_none")}</div>`}</div>`);
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{rfilter=b.dataset.f;reviewsView()});
}

function gameView(id){
  const g=GAMES.find(x=>x.id===id);
  const list=data.reviews.filter(r=>r.game===id),mineR=list.find(r=>r.uid===me.uid);
  shell(`<p><a id="back">${t("back")}</a></p><div class="card"><div class="gm">${art(g)}<div class="info"><b class="nm">${esc(g.name)}</b><div class="small">${esc(g.dev)}</div></div></div></div>
  <div class="card"><b>${mineR?t("rev_edit"):t("rev_write")}</b>
  <textarea id="t" rows="4" maxlength="1000" placeholder="${t("rev_ph")}">${mineR?esc(mineR.text):""}</textarea>
  <div class="small" id="cnt">0/1000</div><div class="msg" id="m"></div><button id="save">${t("rev_save")}</button></div>
  <div class="card"><b>${t("rev_friends",list.length)}</b>${list.map(r=>`<div class="rev">${avatar(r.uid,r.username)}<b>${esc(dname(r.uid,r.username))}</b><div>${esc(r.text)}</div></div>`).join("")||`<div class="small">${t("rev_none2")}</div>`}</div>`);
  const cnt=()=>$("#cnt").textContent=$("#t").value.length+"/1000";cnt();$("#t").oninput=cnt;
  $("#back").onclick=()=>{tab="vote";render()};
  $("#save").onclick=async()=>{const x=$("#t").value.trim();if(!x){$("#m").textContent=t("rev_empty");return}
    $("#save").disabled=true;
    try{await setDoc(doc(db,"reviews",me.uid+"_"+id),{game:id,username,text:x,ts:serverTimestamp(),uid:me.uid});toast(t("rev_saved"));data=null;await load();gameView(id)}
    catch(e){$("#m").textContent=errText(e);$("#save").disabled=false}};
}

onAuthStateChanged(auth,async u=>{
  me=u;data=null;tab="vote";
  if(!u){loginView();return}
  $("#app").innerHTML=`<div class="spin">${t("loading")}</div>`;
  const fallback=(u.email||"").split("@")[0];
  try{
    const ref=doc(db,"users",u.uid),s=await getDoc(ref);
    if(s.exists()){username=s.data().username;profile=s.data();users[u.uid]=profile}
    else{username=pendingName||fallback;await setDoc(ref,{username})}
  }catch(e){username=pendingName||fallback}
  pendingName="";
  render();
});
applyLang();syncOff();initPushListener();
</script>
</body>
</html>
