<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12121a">
<title>لعبة العام - تصويت الأصدقاء</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#232340,#12121a 60%) fixed;color:#eee;min-height:100vh}
header{background:#1d1d2bcc;backdrop-filter:blur(6px);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5;border-bottom:1px solid #2c2c40}
h1{font-size:17px;margin:0}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#1d1d2b;border:1px solid #2a2a3d;border-radius:14px;padding:14px;margin:10px 0;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
input,textarea,button{font:inherit;width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #444;background:#12121a;color:#eee}
input:focus,textarea:focus{outline:2px solid #e8b923;border-color:transparent}
button{background:linear-gradient(135deg,#f3c63a,#e89b23);color:#111;border:0;font-weight:bold;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s;position:relative;overflow:hidden}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px #e8b92344;filter:brightness(1.07)}
button:active{transform:scale(.95)}
button:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
button.sec{background:#2d2d42;color:#eee;width:auto;padding:8px 14px;margin:0;font-weight:normal}
button.sec:hover{box-shadow:0 6px 16px #0006}
button.voted{background:linear-gradient(135deg,#3ddc84,#1fa860);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.ripple{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.msg{color:#ff8a8a;min-height:20px}
.ok{color:#8aff9a}
.nm{display:block;direction:ltr;text-align:right;unicode-bidi:isolate}
.small{color:#aaa;font-size:13px}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{margin:0;background:#232336;color:#ccc;font-weight:normal;padding:9px 4px;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,#f3c63a,#e89b23);color:#111;font-weight:bold}
.gm{display:flex;gap:12px;align-items:stretch}
.cover{width:84px;min-width:84px;height:112px;border-radius:10px;object-fit:cover;background:#2a2a3d;transition:transform .3s}
.card:hover .cover{transform:scale(1.04) rotate(-1deg)}
.ph{width:84px;min-width:84px;height:112px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px;color:#fff;text-align:center;padding:4px}
.info{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row button{margin:0}
.track{height:8px;background:#2a2a3d;border-radius:4px;overflow:hidden;margin-top:6px}
.bar{height:100%;background:linear-gradient(90deg,#e8b923,#f3d66a);border-radius:4px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rev{border-top:1px solid #333;padding:8px 0;animation:rise .4s ease both}
.cd{display:flex;gap:8px;justify-content:center;text-align:center}
.cd div{background:#12121a;border-radius:10px;padding:8px 10px;min-width:62px}
.cd b{font-size:22px;color:#e8b923;display:block}
.rank{display:flex;align-items:center;gap:10px;margin:12px 0}
.rank .n{font-size:24px;width:34px;text-align:center}
.rank .cover{width:44px;min-width:44px;height:58px}
.rank .ph{width:44px;min-width:44px;height:58px;font-size:14px}
a{color:#e8b923;cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3ddc84;color:#111;padding:10px 18px;border-radius:20px;font-weight:bold;z-index:9;animation:rise .3s ease}
.foot{text-align:center;margin:18px 0 30px}
.foot button{background:transparent;border:1px solid #444;color:#ccc;font-weight:normal;width:auto;padding:8px 16px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#1d1d2b;border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:640px;max-height:90vh;overflow:auto;animation:rise .3s ease}
.sheet a.btn{display:block;text-align:center;background:linear-gradient(135deg,#f3c63a,#e89b23);color:#111;font-weight:bold;padding:11px;border-radius:10px;text-decoration:none;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{width:auto;margin:0;padding:6px 12px;font-size:13px;background:#232336;color:#ccc;font-weight:normal}
.chips button.on{background:#e8b923;color:#111}
.off{background:#8a2b2b;color:#fff;text-align:center;padding:6px;font-size:13px;position:sticky;top:48px;z-index:4}
.badge{background:#3ddc84;color:#111;border-radius:8px;padding:1px 7px;font-size:11px;margin-inline-start:4px}
.spin{text-align:center;padding:30px;color:#aaa}
</style>
</head>
<body>
<header><h1>🏆 لعبة العام - تصويت الأصدقاء</h1><div id="who"></div></header>
<div id="off" class="off" style="display:none">⚠️ لا يوجد اتصال بالإنترنت</div>
<main id="app"><div class="spin">جارٍ التحميل...</div></main>
<div id="modal"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,collection,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDaFa5oEOERPkiFkFE05nEWX2OAqvaUUd0",
  authDomain: "goty-vote.firebaseapp.com",
  projectId: "goty-vote",
  storageBucket: "goty-vote.firebasestorage.app",
  messagingSenderId: "501020461143",
  appId: "1:501020461143:web:bc40f4601c8c95a7cd7b12"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);

// آخر موعد للتصويت: 10 ديسمبر 2026 الساعة 4 الفجر بتوقيت القاهرة (= 02:00 UTC)
const DEADLINE = Date.UTC(2026,11,10,2,0,0);
const W = "https://upload.wikimedia.org/wikipedia/en/thumb/";
const GAMES = [
 {id:"007",name:"007 First Light",dev:"IO Interactive",c:"#1b3a5c",img:W+"2/2b/007_First_Light_%282026%29_cover.jpg/250px-007_First_Light_%282026%29_cover.jpg"},
 {id:"control",name:"Control Resonant",dev:"Remedy / Annapurna",c:"#6b1d2e",img:W+"a/a1/Control_Resonant_cover_art.png/250px-Control_Resonant_cover_art.png"},
 {id:"gta6",name:"Grand Theft Auto VI",dev:"Rockstar Games",c:"#7a3b8f",img:W+"4/46/Grand_Theft_Auto_VI.png/250px-Grand_Theft_Auto_VI.png"},
 {id:"phantom",name:"Phantom Blade Zero",dev:"S-GAME",c:"#7a2a1a",img:W+"4/41/Phantom_Blade_Zero_cover_art.jpg/250px-Phantom_Blade_Zero_cover_art.jpg"},
 {id:"re",name:"Resident Evil Requiem",dev:"Capcom",c:"#3a3a3a",img:W+"1/15/Resident_Evil_Requiem_Cover_Art.jpg/250px-Resident_Evil_Requiem_Cover_Art.jpg"},
 {id:"zelda",name:"The Legend of Zelda: Ocarina of Time",dev:"Nintendo",c:"#1f6b3a",img:W+"5/57/The_Legend_of_Zelda_Ocarina_of_Time.jpg/250px-The_Legend_of_Zelda_Ocarina_of_Time.jpg"}
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mail = u => u.toLowerCase()+"@goty.app";
const validUser = u => /^[A-Za-z0-9_]{3,20}$/.test(u);
let lastErr="";
window.addEventListener("error",e=>{lastErr=(e.message||"")+" @"+(e.lineno||"")});
window.addEventListener("unhandledrejection",e=>{lastErr="promise: "+(e.reason&&(e.reason.code||e.reason.message)||e.reason)});
const syncOff=()=>{$("#off").style.display=navigator.onLine?"none":"block"};
addEventListener("online",syncOff);addEventListener("offline",syncOff);syncOff();
const EMAIL="belalshino38@gmail.com",DISCORD="belal57544";
async function copy(t,ok){try{await navigator.clipboard.writeText(t);toast(ok)}catch(e){prompt("انسخ من هنا:",t)}}
function reportView(){
  $("#modal").innerHTML=`<div class="modal" id="mbg"><div class="sheet"><h3 style="margin:0 0 6px">⚠️ بلّغ عن مشكلة</h3>
  <div class="small">لو في خطأ أو حاجة مش شغالة، اكتب المشكلة وابعتها على الإيميل. هنضيف معلومات المتصفح تلقائياً عشان نعرف نصلحها.</div>
  <textarea id="rt" rows="4" maxlength="800" placeholder="اوصف المشكلة (إيه اللي حصل؟ كنت بتعمل إيه؟)"></textarea>
  <a class="btn" id="rmail" href="#">✉️ ابعت على الإيميل</a>
  <button id="rcopyE" class="sec" style="width:100%;margin:6px 0">📋 نسخ الإيميل: ${EMAIL}</button>
  <button id="rcopyD" class="sec" style="width:100%;margin:6px 0">📋 نسخ ديسكورد: ${DISCORD}</button>
  <button id="rclose" class="sec" style="width:100%;margin:6px 0">إغلاق</button></div></div>`;
  const info=()=>"المشكلة: "+$("#rt").value.trim()+"\n\n--- معلومات تلقائية ---\nالمستخدم: "+(username||"(غير مسجل)")+"\nالصفحة: "+location.href+"\nالتبويب: "+tab+"\nالوقت: "+new Date().toString()+"\nالمتصفح: "+navigator.userAgent+"\nالشاشة: "+innerWidth+"x"+innerHeight+"\nالإنترنت: "+(navigator.onLine?"متصل":"غير متصل")+"\nآخر خطأ: "+(lastErr||"لا يوجد");
  const upd=()=>{$("#rmail").href="mailto:"+EMAIL+"?subject="+encodeURIComponent("بلاغ مشكلة - تصويت لعبة العام")+"&body="+encodeURIComponent(info())};
  upd();$("#rt").oninput=upd;
  $("#rmail").onclick=upd;
  $("#rcopyE").onclick=()=>copy(EMAIL,"تم نسخ الإيميل");
  $("#rcopyD").onclick=()=>copy(DISCORD,"تم نسخ اسم ديسكورد");
  $("#rclose").onclick=()=>{$("#modal").innerHTML=""};
  $("#mbg").onclick=e=>{if(e.target.id==="mbg")$("#modal").innerHTML=""};
}
function footer(){return `<div class="foot"><button id="report">⚠️ بلّغ عن مشكلة</button></div>`}
function bindFooter(){const b=$("#report");if(b)b.onclick=reportView}
let me=null, username="", pendingName="", tab="vote", data=null, timer=null;

function art(g){
  const initials=g.name.split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();
  return `<img class="cover" loading="lazy" referrerpolicy="no-referrer" alt="${esc(g.name)}" src="${g.img}" data-ph="${g.id}"><div class="ph" style="display:none;background:linear-gradient(135deg,${g.c},#111)">${esc(initials)}</div>`;
}
document.addEventListener("error",e=>{const t=e.target;if(t.tagName==="IMG"&&t.dataset.ph){t.style.display="none";t.nextElementSibling.style.display="flex"}},true);
// تأثير الموجة على الأزرار
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");
  d.className="ripple";d.style.width=d.style.height=s+"px";d.style.left=(e.clientX-r.left-s/2)+"px";d.style.top=(e.clientY-r.top-s/2)+"px";
  b.appendChild(d);setTimeout(()=>d.remove(),600)});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function errText(e){
  const c=e.code||"";
  if(c.includes("email-already")) return "اسم المستخدم مستخدم بالفعل";
  if(c.includes("weak-password")) return "كلمة السر ضعيفة (6 حروف على الأقل)";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "اسم المستخدم أو كلمة السر غلط";
  if(c.includes("permission")) return "غير مسموح";
  if(c.includes("too-many")) return "محاولات كثيرة، استنى شوية";
  if(c.includes("network")||c.includes("unavailable")) return "مشكلة في الإنترنت، جرّب تاني";
  return "حصل خطأ: "+(c||e.message);
}
function closed(){return Date.now()>=DEADLINE}

function loginView(){
  clearInterval(timer);
  $("#who").innerHTML="";
  $("#app").innerHTML=`<div class="card"><h2>تسجيل الدخول / حساب جديد</h2>
  <form id="f"><input id="u" value="${esc(localStorage.getItem("goty_u")||"")}" placeholder="اسم المستخدم (حروف إنجليزي وأرقام)" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="كلمة السر (6 حروف على الأقل)" autocomplete="current-password">
  <label class="small"><input id="show" type="checkbox" style="width:auto;margin:0 0 0 6px"> إظهار كلمة السر</label>
  <div class="msg" id="m"></div>
  <button id="login" type="submit">دخول</button>
  <button id="reg" type="button" style="background:#2d2d42;color:#eee">إنشاء حساب جديد</button></form></div>`+footer();
  $("#show").onchange=e=>{$("#p").type=e.target.checked?"text":"password"};
  const get=()=>{const u=$("#u").value.trim(),p=$("#p").value;
    if(!validUser(u)){$("#m").textContent="اسم المستخدم: 3 إلى 20 حرف إنجليزي أو أرقام أو _";return null}
    if(p.length<6){$("#m").textContent="كلمة السر 6 حروف على الأقل";return null}
    return [u,p]};
  const busy=v=>{$("#login").disabled=v;$("#reg").disabled=v};
  $("#f").onsubmit=async e=>{e.preventDefault();const x=get();if(!x)return;busy(true);$("#m").textContent="";localStorage.setItem("goty_u",x[0]);
    try{await signInWithEmailAndPassword(auth,mail(x[0]),x[1])}catch(er){$("#m").textContent=errText(er);busy(false)}};
  bindFooter();
  $("#reg").onclick=async()=>{const x=get();if(!x)return;busy(true);$("#m").textContent="";
    pendingName=x[0];
    try{await createUserWithEmailAndPassword(auth,mail(x[0]),x[1])}catch(er){pendingName="";$("#m").textContent=errText(er);busy(false)}};
}

async function load(){
  const [vs,rs]=await Promise.all([getDocs(collection(db,"votes")),getDocs(collection(db,"reviews"))]);
  const votes=[],reviews=[];
  vs.forEach(d=>votes.push({uid:d.id,...d.data()}));
  rs.forEach(d=>reviews.push(d.data()));
  reviews.sort((a,b)=>(b.ts?.seconds||9e9)-(a.ts?.seconds||9e9));
  data={votes,reviews};
}
const myVote=()=>data.votes.find(v=>v.uid===me.uid)?.game||null;
const counts=()=>{const c={};data.votes.forEach(v=>c[v.game]=(c[v.game]||0)+1);return c};

function shell(inner){
  $("#who").innerHTML=`<span class="small">${esc(username)}</span> <button class="sec" id="rf" title="تحديث">🔄</button> <button class="sec" id="out">خروج</button>`;
  $("#rf").onclick=()=>{toast("جارٍ التحديث...");refresh()};
  $("#out").onclick=()=>signOut(auth);
  $("#app").innerHTML=`<div class="tabs">
   <button data-t="vote" class="${tab==="vote"?"on":""}">🗳️ التصويت</button>
   <button data-t="results" class="${tab==="results"?"on":""}">📊 النتائج</button>
   <button data-t="reviews" class="${tab==="reviews"?"on":""}">💬 التقييمات</button></div>`+inner+footer();
  bindFooter();
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}
function countdown(){
  const left=DEADLINE-Date.now();
  if(left<=0)return `<div class="card" style="text-align:center">⏰ انتهى وقت التصويت. النتائج النهائية في تبويب النتائج.</div>`;
  return `<div class="card"><div class="small" style="text-align:center;margin-bottom:6px">⏳ باقي على نهاية التصويت (10 ديسمبر الساعة 4 الفجر بتوقيت القاهرة)</div>
  <div class="cd"><div><b id="cd-d">0</b>يوم</div><div><b id="cd-h">0</b>ساعة</div><div><b id="cd-m">0</b>دقيقة</div><div><b id="cd-s">0</b>ثانية</div></div></div>`;
}
function tick(){
  const l=Math.max(0,DEADLINE-Date.now()),s=Math.floor(l/1000);
  const set=(i,v)=>{const e=$("#cd-"+i);if(e)e.textContent=v};
  set("d",Math.floor(s/86400));set("h",Math.floor(s%86400/3600));set("m",Math.floor(s%3600/60));set("s",s%60);
}
async function render(){
  clearInterval(timer);
  if(!data){$("#app").innerHTML='<div class="spin">جارٍ التحميل...</div>';
    try{await load()}catch(e){$("#app").innerHTML=`<div class="card"><div class="msg">${esc(errText(e))}</div><button id="retry">إعادة المحاولة</button></div>`;$("#retry").onclick=render;return}}
  if(tab==="results")return resultsView();
  if(tab==="reviews")return reviewsView();
  homeView();
}
async function refresh(){data=null;await render()}

function homeView(){
  const mine=myVote(),c=counts(),total=data.votes.length||1,open=!closed();
  shell(countdown()+
   (mine?`<div class="card ok">✅ صوتّ لـ: <bdi>${esc(GAMES.find(g=>g.id===mine).name)}</bdi>${open?" (تقدر تغيّر صوتك)":""}</div>`:`<div class="card">لسه ما صوتّش. اختار لعبة وصوّت 👇</div>`)+
   GAMES.map((g,i)=>`<div class="card" style="animation-delay:${i*.06}s"><div class="gm">${art(g)}<div class="info">
     <div><b class="nm">${esc(g.name)}</b><div class="small">${esc(g.dev)}</div></div>
     <div><div class="small">${c[g.id]||0} صوت</div><div class="track"><div class="bar" data-w="${Math.round((c[g.id]||0)/total*100)}"></div></div></div>
     <div class="row"><button data-v="${g.id}" class="${mine===g.id?"voted":""}" ${open?"":"disabled"}>${mine===g.id?"✔ صوتك":"صوّت"}</button><button class="sec" data-r="${g.id}">💬 ${data.reviews.filter(r=>r.game===g.id).length}</button></div>
   </div></div></div>`).join("")+
   `<div class="card" style="text-align:center"><div class="small" style="margin-bottom:6px">ادعو أصحابك للتصويت</div><button id="share">📤 شارك رابط الموقع</button><button id="shareR" class="sec" style="width:100%;margin-top:8px">📊 شارك النتائج الحالية</button></div>`);
  setTimeout(()=>document.querySelectorAll(".bar").forEach(b=>b.style.width=b.dataset.w+"%"),50);
  if(open){tick();timer=setInterval(tick,1000)}
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{
    document.querySelectorAll("[data-v]").forEach(x=>x.disabled=true);
    try{await setDoc(doc(db,"votes",me.uid),{game:b.dataset.v,username,ts:serverTimestamp()});toast("تم تسجيل صوتك ✔");await refresh()}
    catch(e){alert(errText(e));render()}});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>gameView(b.dataset.r));
  $("#share").onclick=shareSite;$("#shareR").onclick=shareResults;
}
async function shareSite(){
  const url=location.origin+location.pathname,text="صوّت معايا على لعبة العام 🏆 "+url;
  if(navigator.share){try{await navigator.share({title:"لعبة العام",text:"صوّت معايا على لعبة العام 🏆",url});return}catch(e){if(e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);toast("تم نسخ الرابط")}catch(e){window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
}

async function shareResults(){
  const c=counts(),t=data.votes.length;
  const lines=GAMES.slice().sort((a,b)=>(c[b.id]||0)-(c[a.id]||0)).map((g,i)=>(i+1)+". "+g.name+" - "+(c[g.id]||0)+" صوت");
  const text="🏆 نتائج تصويت لعبة العام بين الأصحاب ("+t+" صوت)\n"+lines.join("\n")+"\nصوّت معانا: "+location.origin+location.pathname;
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e.name==="AbortError")return}}
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}
function resultsView(){
  const c=counts(),total=data.votes.length;
  const sorted=GAMES.slice().sort((a,b)=>(c[b.id]||0)-(c[a.id]||0));
  const top=c[sorted[0].id]||0, tied=sorted.filter(g=>(c[g.id]||0)===top);
  const medals=["🥇","🥈","🥉"];
  const names=g=>data.votes.filter(v=>v.game===g.id).map(v=>esc(v.username)).join("، ");
  shell(`<div class="card"><b>إجمالي الأصوات: ${total}</b>
   ${total?`<div class="small" style="margin-top:4px">${tied.length>1?"تعادل في الصدارة بين "+tied.map(g=>"<bdi>"+esc(g.name)+"</bdi>").join(" و "):"المتصدر: "+"<bdi>"+esc(sorted[0].name)+"</bdi>"}</div>`:'<div class="small">لا توجد أصوات بعد</div>'}</div>`+
  sorted.map((g,i)=>`<div class="card" style="animation-delay:${i*.06}s"><div class="rank"><div class="n">${medals[i]||i+1}</div>${art(g)}
   <div class="info" style="gap:4px"><b class="nm">${esc(g.name)}</b><div class="small">${c[g.id]||0} صوت (${total?Math.round((c[g.id]||0)/total*100):0}%)</div>
   <div class="track"><div class="bar" data-w="${total?Math.round((c[g.id]||0)/total*100):0}"></div></div></div></div>
   ${names(g)?`<div class="small">👥 ${names(g)}</div>`:""}</div>`).join(""));
  setTimeout(()=>document.querySelectorAll(".bar").forEach(b=>b.style.width=b.dataset.w+"%"),50);
}

let rfilter="";
function reviewsView(){
  const list=data.reviews.filter(r=>!rfilter||r.game===rfilter);
  shell(`<div class="chips"><button data-f="" class="${rfilter===""?"on":""}">الكل</button>${GAMES.map(g=>`<button data-f="${g.id}" class="${rfilter===g.id?"on":""}">${esc({"007":"007","control":"Control","gta6":"GTA VI","phantom":"Phantom Blade","re":"Resident Evil","zelda":"Zelda OoT"}[g.id])}</button>`).join("")}</div>
  <div class="card"><b>آخر التقييمات (${list.length})</b>
  ${list.map(r=>{const g=GAMES.find(x=>x.id===r.game);return g?`<div class="rev"><b>${esc(r.username)}</b>${r.uid===me.uid?'<span class="badge">أنت</span>':""} <span class="small">عن <bdi>${esc(g.name)}</bdi></span><div>${esc(r.text)}</div></div>`:""}).join("")||'<div class="small">لا توجد تقييمات بعد. افتح أي لعبة من التصويت واكتب رأيك.</div>'}</div>`);

  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{rfilter=b.dataset.f;reviewsView()});
}

function gameView(id){
  const g=GAMES.find(x=>x.id===id);
  const list=data.reviews.filter(r=>r.game===id),mineR=list.find(r=>r.uid===me.uid);
  shell(`<p><a id="back">← رجوع</a></p><div class="card"><div class="gm">${art(g)}<div class="info"><b class="nm">${esc(g.name)}</b><div class="small">${esc(g.dev)}</div></div></div></div>
  <div class="card"><b>${mineR?"عدّل تقييمك":"اكتب تقييمك"}</b>
  <textarea id="t" rows="4" maxlength="1000" placeholder="رأيك في اللعبة...">${mineR?esc(mineR.text):""}</textarea>
  <div class="small" id="cnt">0/1000</div><div class="msg" id="m"></div><button id="save">حفظ التقييم</button></div>
  <div class="card"><b>تقييمات الأصدقاء (${list.length})</b>${list.map(r=>`<div class="rev"><b>${esc(r.username)}</b><div>${esc(r.text)}</div></div>`).join("")||'<div class="small">لا توجد تقييمات بعد</div>'}</div>`);
  const cnt=()=>$("#cnt").textContent=$("#t").value.length+"/1000";cnt();$("#t").oninput=cnt;
  $("#back").onclick=()=>{tab="vote";render()};
  $("#save").onclick=async()=>{const t=$("#t").value.trim();if(!t){$("#m").textContent="اكتب تقييم";return}
    $("#save").disabled=true;
    try{await setDoc(doc(db,"reviews",me.uid+"_"+id),{game:id,username,text:t,ts:serverTimestamp(),uid:me.uid});toast("تم حفظ تقييمك ✔");data=null;await load();gameView(id)}
    catch(e){$("#m").textContent=errText(e);$("#save").disabled=false}};
}

onAuthStateChanged(auth,async u=>{
  me=u;data=null;tab="vote";
  if(!u){loginView();return}
  $("#app").innerHTML='<div class="spin">جارٍ التحميل...</div>';
  const fallback=(u.email||"").split("@")[0];
  try{
    const ref=doc(db,"users",u.uid),s=await getDoc(ref);
    if(s.exists())username=s.data().username;
    else{username=pendingName||fallback;await setDoc(ref,{username})}
  }catch(e){username=pendingName||fallback}
  pendingName="";
  render();
});
</script>
</body>
</html>
